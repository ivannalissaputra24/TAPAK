name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: node prepare.js
      - run: npx cap add android
      - name: Buat ikon & splash TAPAK
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#14532d' --iconBackgroundColorDark '#14532d' --splashBackgroundColor '#14532d' --splashBackgroundColorDark '#14532d'
      - name: Tambah izin Android (lokasi, kamera, foto, internet)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms=['INTERNET','ACCESS_NETWORK_STATE','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','CAMERA','READ_MEDIA_IMAGES']
          add=''.join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in perms if f'android.permission.{x}"' not in s)
          add+='    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
          add+='    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          add+='    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n'
          s=s.replace('<application',add+'    <application',1)
          open(p,'w').write(s)
          PY
          grep -E "uses-(permission|feature)" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: TAPAK-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
