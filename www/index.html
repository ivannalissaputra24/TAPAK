<!DOCTYPE html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel=stylesheet href=lib/leaflet.css>
<style>
html,body{margin:0;height:100%;font:14px sans-serif}#map{position:absolute;inset:0 0 56px 0}
#hud{position:absolute;top:6px;left:6px;z-index:900;background:#fffd;border-radius:8px;padding:6px 8px;max-width:70vw;font-size:12px;line-height:1.5}
#compass{position:absolute;top:6px;right:6px;z-index:900;background:#fffd;border-radius:50%;width:58px;height:58px;text-align:center;font-size:11px}
#compass i{display:block;font-style:normal;font-size:22px;transition:transform .2s}
nav{position:absolute;bottom:0;left:0;right:0;height:56px;display:flex;background:#1f2937;z-index:1000}
nav button{flex:1;border:0;background:none;color:#fff;font-size:11px}nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{background:#e11d48}
#sheet{position:absolute;bottom:56px;left:0;right:0;max-height:62vh;overflow:auto;background:#fff;z-index:1001;padding:10px;box-shadow:0 -2px 8px #0005}
#dbar{position:absolute;bottom:64px;left:6px;right:6px;z-index:950;background:#1d4ed8;color:#fff;padding:6px;border-radius:8px;display:flex;gap:6px;align-items:center}
#dbar span{flex:1;font-size:12px}
button.p,#sheet button{padding:8px 10px;margin:3px 2px;border:1px solid #999;border-radius:6px;background:#f3f4f6;font-size:13px}
#sheet input,#sheet textarea,#sheet select{width:100%;box-sizing:border-box;padding:7px;margin:3px 0;font-size:14px}
.r{display:flex;gap:4px}.th{display:inline-block;margin:3px;font-size:10px;text-align:center}.th img{width:80px;height:80px;object-fit:cover;display:block}
.lt{background:#fffc;border:0;box-shadow:none;font-size:11px}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;z-index:2000;display:none}
li{padding:8px 0;border-bottom:1px solid #eee}
</style></head><body>
<div id=map></div><div id=hud>Mencari GPS…</div>
<div id=compass><i id=ar>⬆</i><span id=hd>--</span></div>
<div id=dbar hidden><span id=dinfo></span><button class=p onclick=undo()>↶</button><button class=p onclick=finish()>✔</button><button class=p onclick=cancel()>✖</button></div>
<div id=sheet hidden></div><div id=toast></div>
<nav>
<button onclick=pLayers()><b>🗺</b>Peta</button><button onclick=locate()><b>📍</b>Lokasi</button>
<button id=bt onclick=toggleTrack()><b>⏺</b>Track</button><button onclick=pDraw()><b>✏️</b>Gambar</button>
<button onclick=pMeasure()><b>📏</b>Ukur</button><button onclick=pList()><b>📋</b>Data</button><button onclick=pMenu()><b>⚙️</b>Menu</button></nav>
<input type=file id=pdfin accept="application/pdf" hidden onchange="importPDF(this.files[0]);this.value=''">
<input type=file id=cam accept="image/*" capture=environment hidden onchange="addPhoto(this)">
<input type=file id=gal accept="image/*" hidden onchange="addPhoto(this)">
<script src=lib/leaflet.js></script><script src=lib/pdf.min.js></script><script src=lib/proj4.js></script>
<script src=lib/jszip.min.js></script><script src=lib/piexif.js></script><script src=lib/shpwrite.js></script>
<script src=app.js></script></body></html>
